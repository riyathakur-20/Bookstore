<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
        }

        .form-box {
            width: 500px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border: 2px solid black;
        }

        h1 {
            text-align: center;
            background-color: #f4bd8a;
            padding: 10px;
        }

        label {
            display: inline-block;
            width: 150px;
            margin-bottom: 15px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        textarea {
            padding: 6px;
            width: 250px;
        }

        textarea {
            height: 70px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 8px 20px;
            margin: 10px;
        }

        .buttons {
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="form-box">

        <h1>Registration Form</h1>

        <form>

            <label>Name:</label>
            <input type="text" name="name">
            <br>

            <label>Password:</label>
            <input type="password" name="password">
            <br>

            <label>E-mail ID:</label>
            <input type="email" name="email">
            <br>

            <label>Phone Number:</label>
            <input type="text" name="phone">
            <br>

            <label>Sex:</label>

            <input type="radio" name="sex" value="Male">
            Male

            <input type="radio" name="sex" value="Female">
            Female

            <br><br>

            <label>Date of Birth:</label>

            <select name="day">
                <option>Day</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option>11</option>
                <option>12</option>
                <option>13</option>
                <option>14</option>
                <option>15</option>
                <option>16</option>
                <option>17</option>
                <option>18</option>
                <option>19</option>
                <option>20</option>
                <option>21</option>
                <option>22</option>
                <option>23</option>
                <option>24</option>
                <option>25</option>
                <option>26</option>
                <option>27</option>
                <option>28</option>
                <option>29</option>
                <option>30</option>
                <option>31</option>
            </select>

            <select name="month">
                <option>Month</option>
                <option>January</option>
                <option>February</option>
                <option>March</option>
                <option>April</option>
                <option>May</option>
                <option>June</option>
                <option>July</option>
                <option>August</option>
                <option>September</option>
                <option>October</option>
                <option>November</option>
                <option>December</option>
            </select>

            <select name="year">
                <option>Year</option>
                <option>2000</option>
                <option>2001</option>
                <option>2002</option>
                <option>2003</option>
                <option>2004</option>
                <option>2005</option>
                <option>2006</option>
                <option>2007</option>
                <option>2008</option>
            </select>

            <br><br>

            <label>Languages Known:</label>

            <input type="checkbox" name="language" value="English">
            English

            <input type="checkbox" name="language" value="Telugu">
            Telugu

            <input type="checkbox" name="language" value="Hindi">
            Hindi

            <input type="checkbox" name="language" value="Tamil">
            Tamil

            <br><br>

            <label>Address:</label>
            <textarea name="address"></textarea>

            <br><br>

            <div class="buttons">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </div>

        </form>

    </div>

</body>
</html>
