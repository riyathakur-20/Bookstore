<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GL Bajaj Online Bookstore</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
        }

        /* MAIN BORDER */
        .main-container {
            width: 100%;
            min-height: 100vh;
            border: 2px solid black;
        }

        /* TOP COLLEGE NAME */
        .college-name {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;

            background-color: white;

            border-bottom: 1px solid black;

            font-size: 28px;
            font-weight: bold;
        }

        /* LOGO + BOOKSTORE AREA */
        .bookstore-header {
            height: 77px;

            display: grid;
            grid-template-columns: 20% 80%;

            background-color: #fc8647;

            border-bottom: 1px solid black;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
        }

.logo img {
    width: 80px;
    height: 80px;
    object-fit: contain;
}
        .bookstore-title {
            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
            font-weight: bold;
        }

        /* NAVIGATION */
        .navigation {
            height: 47px;

            display: grid;
            grid-template-columns: repeat(5, 1fr);

            background-color: #f9ead5;

            border-bottom: 1px solid black;
        }

        .navigation a {
            display: flex;
            justify-content: center;
            align-items: center;

            color: black;
            text-decoration: none;

            font-size: 18px;
            font-weight: bold;

            border-right: 1px solid #999;

            cursor: pointer;
        }

        .navigation a:last-child {
            border-right: none;
        }

        .navigation a:hover {
            background-color: #ead5bd;
        }

        /* MAIN BODY */
        .body-area {
            display: grid;
            grid-template-columns: 20% 80%;

            min-height: 428px;
        }

        /* LEFT SIDE */
        .left-panel {
            background-color: #f9ead5;

            border-right: 2px solid black;
        }

        .branch-link {
            height: 56px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-bottom: 1px solid #aaa;

            font-size: 18px;
            font-weight: bold;
        }

        .branch-link a {
            color: blue;
            text-decoration: underline;
            cursor: pointer;
        }

        /* RIGHT SIDE */
        .right-panel {
            background-color: white;

            position: relative;

            overflow: auto;
        }

        /* HOME */
        .home-content {
            height: 428px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 18px;
            font-weight: bold;
        }

        /* PAGE IFRAME */

        #contentFrame {
            width: 100%;
            height: 100%;

            min-height: 428px;

            border: none;

            display: none;
        }

    </style>
</head>

        frame.src = page;
    }


    /* HOME */

    function showHome() {

        const frame = document.getElementById("contentFrame");

        frame.style.display = "none";

        frame.src = "";

        document.getElementById("homeContent").style.display = "flex";
    }


    /* CSE / ECE / EEE / CIVIL */

    function blankPage() {

        const frame = document.getElementById("contentFrame");

        frame.style.display = "none";

        frame.src = "";

        document.getElementById("homeContent").style.display = "none";
    }

</script>

</body>
