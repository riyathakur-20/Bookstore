<!DOCTYPE html>
<html>
<head>
    <title>GL Bajaj Online Bookstore - Catalogue</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
            background-color: #f4b183;
            padding: 15px;
            border: 1px solid black;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #f4b183;
        }

        .menu {
            background-color: #fde9d9;
        }

        .book {
            width: 100px;
            height: 130px;
        }

        .cart {
            background-color: #f4b183;
            border: 1px solid black;
            padding: 8px 15px;
            cursor: pointer;
        }

        .cart:hover {
            background-color: #e69138;
        }

        a {
            color: black;
            text-decoration: none;
        }

        a:hover {
            color: blue;
            text-decoration: underline;
        }
    </style>
</head>

<body>

   

    <table>

       
       

        <tr>
            <th>Book Cover</th>
            <th>Book Details</th>
            <th>Author</th>
            <th>Price</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>
                <img class="book"
                     src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTpyi9OMpUChEk1hweh5CroZmVwbQpSlHdU1ayw8L-fYw&s=10"
                     alt="Elements of ECE">
            </td>

            <td>
                <b>Elements of ECE</b><br>
                Publication: upsc
            </td>

            <td>Winston</td>

            <td>$70.5</td>

            <td>
                <button class="cart">Add to Cart</button>
            </td>
        </tr>

        <tr>
            <td>
                <img class="book"
                     src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9cWPjh9Oclek016xUKlwIFTCvfXCURkKNwjNyKrPx-A&s=10"
                     alt="Basics of electrical engineering">
            </td>

            <td>
                <b>asics of electrical engineering/b><br>
                Publication: Prentice Hall
            </td>

            <td>S. Russell</td>

            <td>$53</td>

            <td>
                <button class="cart">Add to Cart</button>
            </td>
        </tr>

        
        

    </table>

</body>
</html>
