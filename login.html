<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .login-container {
            width: 100%;
            height: 430px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 28px;
        }

        .form-row {
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-row label {
            width: 100px;
            text-align: right;
            margin-right: 12px;
        }

        .form-row input {
            width: 180px;
            height: 26px;
            box-sizing: border-box;
        }

        .buttons {
            margin-top: 30px;
        }

        .buttons input {
            padding: 8px 20px;
            margin: 0 8px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h2>Login Page</h2>

            <form>

                <div class="form-row">
                    <label for="username">User Name:</label>
                    <input type="text" id="username" name="username">
                </div>

                <div class="form-row">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password">
                </div>

                <div class="buttons">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </div>

            </form>

        </div>

    </div>

</body>
</html>
